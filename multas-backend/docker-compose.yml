services:
  mysql:
    image: mysql:8.4
    container_name: pmt-multas-mysql-dev
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_NAME:-pmt_multas}"
      MYSQL_USER: "${DB_USER:?Defina DB_USER en .env.docker}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD en .env.docker}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env.docker}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - pmt_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pmt_mysql_data:
