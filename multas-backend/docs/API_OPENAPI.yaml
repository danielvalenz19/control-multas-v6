      parameters:
        - { in: header, name: X-File-Name, required: true, schema: { type: string, pattern: '^[^/\\]+\.csv$' } }
        - { in: header, name: X-Source-System, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { in: header, name: X-Migration-Entity, required: true, schema: { $ref: '#/components/schemas/HistoricalEntity' } }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string, format: binary } }
      responses:
        '201': { description: Nuevo lote UPLOADED }
        '200': { description: Reintento idempotente del mismo archivo }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /admin/historical-migrations/batches:
