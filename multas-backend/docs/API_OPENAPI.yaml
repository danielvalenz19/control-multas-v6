openapi: 3.1.0
info:
  title: PMT Multas API - TANDAS 0–8, 10 y 11
  version: 1.2.0
  description: Contrato de autenticación, operación municipal, finanzas, solvencias, analítica, notificaciones y migración histórica controlada.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Auth
  - name: Citizens
  - name: Vehicles
  - name: Administration
  - name: Catalogs
  - name: Infractions
  - name: Evidence
  - name: Appeals
  - name: Adjustments
  - name: Institutional rules
  - name: Public portal
  - name: Cash
  - name: Payments
  - name: Reconciliations
  - name: Solvencies
  - name: Dashboard
  - name: Reports
  - name: Notifications
  - name: Historical migrations
paths:
  /system/health:
    get:
      tags: [System]
      summary: Comprueba que el proceso está activo
      responses:
        '200': { description: Proceso activo }
  /system/readiness:
    get:
      tags: [System]
      summary: Comprueba MySQL y el contrato auth
      responses:
        '200': { description: Servicio listo }
        '503': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Abre una sesión opaca en cookie HttpOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, maxLength: 191 }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200':
          description: Sesión creada; el token existe únicamente en Set-Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ sessionCookie: [] }]
      summary: Devuelve el usuario, roles y permisos vigentes
      responses:
        '200': { description: Identidad autenticada }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoca idempotentemente la sesión indicada por la cookie
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Cookie eliminada; operación idempotente }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoca todas las sesiones del usuario
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Todas las sesiones fueron revocadas }
        '401': { $ref: '#/components/responses/Error' }
  /auth/sessions:
    get:
      tags: [Auth]
      summary: Lista sesiones propias sin exponer hashes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Sesiones propias }
        '401': { $ref: '#/components/responses/Error' }
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoca una sesión propia o, con privilegio ADMIN, una ajena
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '204': { description: Sesión revocada }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Cambia la contraseña y revoca las otras sesiones
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, writeOnly: true }
                newPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Contraseña cambiada }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /citizens:
    get:
      tags: [Citizens]
      security: [{ sessionCookie: [] }]
      summary: Lista ciudadanos con búsqueda y paginación
      responses:
        '200': { description: Página de ciudadanos; datos sensibles según permiso }
    post:
      tags: [Citizens]
      security: [{ sessionCookie: [] }]
      summary: Crea un ciudadano
      responses:
        '201': { description: Ciudadano creado }
        '409': { $ref: '#/components/responses/Error' }
  /citizens/{id}:
    get:
      tags: [Citizens]
      security: [{ sessionCookie: [] }]
      summary: Consulta un ciudadano
      responses:
        '200': { description: Ciudadano }
    patch:
      tags: [Citizens]
      security: [{ sessionCookie: [] }]
      summary: Actualiza un ciudadano
      responses:
        '204': { description: Ciudadano actualizado }
  /vehicles:
    get:
      tags: [Vehicles]
      security: [{ sessionCookie: [] }]
      summary: Lista vehículos con búsqueda y paginación
      responses:
        '200': { description: Página de vehículos }
    post:
      tags: [Vehicles]
      security: [{ sessionCookie: [] }]
      summary: Crea un vehículo con placa normalizada única
      responses:
        '201': { description: Vehículo creado }
        '409': { $ref: '#/components/responses/Error' }
  /vehicles/{id}/ownerships:
    get:
      tags: [Vehicles]
      security: [{ sessionCookie: [] }]
      summary: Consulta el historial de propietarios
      responses:
        '200': { description: Historial cronológico }
    post:
      tags: [Vehicles]
      security: [{ sessionCookie: [] }]
      summary: Asigna un propietario cuando no existe otro vigente
      responses:
        '201': { description: Propiedad creada }
        '409': { $ref: '#/components/responses/Error' }
  /users:
    get:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Lista usuarios institucionales con paginación y filtros
      responses: { '200': { description: Página de usuarios }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Crea un usuario con contraseña Argon2id
      responses: { '201': { description: Usuario creado }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /users/{id}:
    get:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Consulta un usuario sin exponer password_hash
      responses: { '200': { description: Usuario institucional } }
    patch:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Actualiza datos del usuario
      responses: { '204': { description: Usuario actualizado }, '409': { $ref: '#/components/responses/Error' } }
  /users/{id}/roles:
    put:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Reemplaza roles protegiendo al último ADMIN activo
      responses: { '204': { description: Roles asignados }, '409': { $ref: '#/components/responses/Error' } }
  /users/{id}/activate:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Activa un usuario institucional
      responses: { '204': { description: Usuario activado }, '404': { $ref: '#/components/responses/Error' } }
  /users/{id}/deactivate:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Desactiva un usuario, revoca sus sesiones y protege al último ADMIN
      responses: { '204': { description: Usuario desactivado }, '409': { $ref: '#/components/responses/Error' } }
  /users/{id}/revoke-sessions:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Revoca todas las sesiones de un usuario
      responses: { '204': { description: Sesiones revocadas }, '404': { $ref: '#/components/responses/Error' } }
  /roles:
    get:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Lista roles y permisos disponibles
      responses: { '200': { description: Roles y matriz de permisos } }
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Crea un rol institucional
      responses: { '201': { description: Rol creado }, '409': { $ref: '#/components/responses/Error' } }
  /roles/{id}:
    patch:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Actualiza un rol institucional
      responses: { '204': { description: Rol actualizado }, '404': { $ref: '#/components/responses/Error' } }
  /roles/{id}/permissions:
    put:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Reemplaza atómicamente los permisos asignados al rol
      responses: { '204': { description: Permisos asignados }, '404': { $ref: '#/components/responses/Error' } }
  /agents:
    get:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Lista agentes PMT
      responses: { '200': { description: Página de agentes } }
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Registra un agente único relacionado con un usuario activo
      responses: { '201': { description: Agente creado }, '409': { $ref: '#/components/responses/Error' } }
  /agents/{id}:
    get:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Consulta un agente PMT
      responses: { '200': { description: Agente PMT }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Actualiza la relación operativa de un agente
      responses: { '204': { description: Agente actualizado }, '409': { $ref: '#/components/responses/Error' } }
  /agents/{id}/activate:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Activa un agente
      responses: { '204': { description: Agente activado } }
  /agents/{id}/deactivate:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Desactiva un agente sin eliminar su historial
      responses: { '204': { description: Agente desactivado } }
  /devices:
    get:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Lista dispositivos y asignación vigente
      responses: { '200': { description: Página de dispositivos } }
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Registra un dispositivo institucional
      responses: { '201': { description: Dispositivo creado }, '409': { $ref: '#/components/responses/Error' } }
  /devices/{id}/assign:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Asigna un dispositivo conservando historial
      responses: { '201': { description: Asignación creada }, '409': { $ref: '#/components/responses/Error' } }
  /devices/{id}:
    get:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Consulta dispositivo, asignación vigente e historial
      responses: { '200': { description: Dispositivo institucional }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Actualiza datos del dispositivo
      responses: { '204': { description: Dispositivo actualizado }, '409': { $ref: '#/components/responses/Error' } }
  /devices/{id}/unassign:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Libera la asignación vigente y conserva el historial
      responses: { '204': { description: Dispositivo liberado }, '404': { $ref: '#/components/responses/Error' } }
  /devices/{id}/block:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Bloquea un dispositivo
      responses: { '204': { description: Dispositivo bloqueado } }
  /devices/{id}/unblock:
    post:
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      summary: Reactiva un dispositivo bloqueado
      responses: { '204': { description: Dispositivo reactivado } }
  /catalogs/{catalog}:
    get:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Lista el catálogo permitido
      responses: { '200': { description: Página de catálogo } }
    post:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Crea un valor de catálogo sin borrado físico
      responses: { '201': { description: Registro creado }, '409': { $ref: '#/components/responses/Error' } }
  /catalogs/{catalog}/{id}:
    patch:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Actualiza o activa/desactiva lógicamente un valor de catálogo
      responses: { '204': { description: Registro actualizado }, '409': { $ref: '#/components/responses/Error' } }
  /catalogs/infraction-rate-versions:
    get:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Lista el historial inmutable de tarifas con búsqueda y paginación
      responses: { '200': { description: Página de versiones tarifarias } }
    post:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Crea una tarifa nueva y cierra la vigencia previa sin modificar su monto
      responses: { '201': { description: Versión creada }, '409': { $ref: '#/components/responses/Error' } }
  /catalogs/document-sequences:
    get:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Lista correlativos por sede, tipo y año con búsqueda y paginación
      responses: { '200': { description: Página de correlativos } }
    post:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Crea un correlativo único por sede, tipo y año
      responses: { '201': { description: Correlativo creado }, '409': { $ref: '#/components/responses/Error' } }
  /catalogs/document-sequences/{id}:
    patch:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Actualiza la configuración de un correlativo
      responses: { '204': { description: Correlativo actualizado }, '404': { $ref: '#/components/responses/Error' } }
  /catalogs/document-sequences/{id}/next:
    post:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Obtiene el siguiente número bajo bloqueo transaccional de fila
      responses: { '200': { description: Número único generado } }
  /catalogs/lookups:
    get:
      tags: [Catalogs]
      security: [{ sessionCookie: [] }]
      summary: Devuelve sedes, zonas y departamentos activos para formularios
      responses: { '200': { description: Catálogos de selección activos } }
  /infractions:
    get:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Lista infracciones; los agentes reciben solamente sus boletas
      responses: { '200': { description: Página de infracciones } }
    post:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Crea un borrador con snapshots, artículos y total calculado en servidor
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 191 }
      responses: { '201': { description: Borrador creado o respuesta idempotente }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /infractions/{id}:
    get:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Devuelve expediente, snapshots, artículos, evidencias y revisiones
      responses: { '200': { description: Expediente completo }, '403': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Corrige una boleta BORRADOR o DEVUELTA_CORRECCION
      responses: { '204': { description: Borrador actualizado }, '409': { $ref: '#/components/responses/Error' } }
  /infractions/{id}/submit:
    post:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Envía idempotentemente a validación
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses: { '204': { description: Boleta enviada }, '409': { $ref: '#/components/responses/Error' } }
  /infractions/{id}/validate:
    post:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Valida una boleta; prohíbe autovalidación del agente
      responses: { '204': { description: Boleta validada }, '409': { $ref: '#/components/responses/Error' } }
  /infractions/{id}/return:
    post:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Devuelve con motivo, comentario y campos señalados
      responses: { '204': { description: Boleta devuelta }, '422': { $ref: '#/components/responses/Error' } }
  /infractions/{id}/reject:
    post:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Rechaza con motivo institucional
      responses: { '204': { description: Boleta rechazada } }
  /infractions/{id}/cancel:
    post:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Anula lógicamente con motivo institucional
      responses: { '204': { description: Boleta anulada } }
  /infractions/{id}/evidence:
    post:
      tags: [Evidence]
      security: [{ sessionCookie: [] }]
      summary: Guarda JPEG, PNG o PDF privado, valida su firma binaria y registra SHA-256
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses: { '201': { description: Evidencia registrada }, '413': { $ref: '#/components/responses/Error' }, '415': { $ref: '#/components/responses/Error' } }
  /infractions/{id}/evidence/{evidenceId}:
    get:
      tags: [Evidence]
      security: [{ sessionCookie: [] }]
      summary: Entrega una evidencia activa mediante autorización y sin caché pública
      responses:
        '200':
          description: Binario privado JPEG, PNG o PDF
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /infractions/{id}/timeline:
    get:
      tags: [Infractions]
      security: [{ sessionCookie: [] }]
      summary: Devuelve la línea de tiempo legal completa
      responses: { '200': { description: Historial cronológico } }
  /appeals:
    get:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Lista impugnaciones con búsqueda, estado y paginación
      responses: { '200': { description: Página de impugnaciones }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Presenta una impugnación sobre una infracción validada
      responses: { '201': { description: Expediente creado y plazo configurado o pendiente de confirmación }, '409': { $ref: '#/components/responses/Error' } }
  /appeals/{id}:
    get:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Obtiene solicitud, resolución, evidencia, historial y ajustes relacionados
      responses: { '200': { description: Expediente completo }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Corrige una solicitud presentada o con información requerida
      responses: { '204': { description: Solicitud actualizada }, '409': { $ref: '#/components/responses/Error' } }
  /appeals/{id}/submit:
    post:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Envía o reenvía el expediente a revisión
      responses: { '204': { description: Estado EN_REVISION }, '409': { $ref: '#/components/responses/Error' } }
  /appeals/{id}/request-information:
    post:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Solicita información adicional con comentario obligatorio
      responses: { '204': { description: Estado REQUIERE_INFORMACION }, '409': { $ref: '#/components/responses/Error' } }
  /appeals/{id}/resolve:
    post:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Confirma, modifica mediante ajuste o anula mediante resolución; prohíbe autorresolución
      responses: { '200': { description: Resolución e historial registrados }, '409': { $ref: '#/components/responses/Error' } }
  /appeals/{id}/withdraw:
    post:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Registra el desistimiento sin borrar el expediente
      responses: { '204': { description: Estado DESISTIDA }, '409': { $ref: '#/components/responses/Error' } }
  /appeals/{id}/evidence:
    post:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Adjunta JPEG, PNG o PDF a almacenamiento privado validando firma y SHA-256
      responses: { '201': { description: Evidencia privada registrada }, '415': { $ref: '#/components/responses/Error' } }
  /appeals/{id}/evidence/{evidenceId}:
    get:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Entrega evidencia autorizada con caché privada deshabilitada
      responses: { '200': { description: Documento privado }, '403': { $ref: '#/components/responses/Error' } }
  /appeals/{id}/timeline:
    get:
      tags: [Appeals]
      security: [{ sessionCookie: [] }]
      summary: Devuelve el historial íntegro del expediente
      responses: { '200': { description: Historial cronológico } }
  /infractions/{id}/adjustments:
    get:
      tags: [Adjustments]
      security: [{ sessionCookie: [] }]
      summary: Devuelve libro de ajustes, historial y saldo exacto
      responses: { '200': { description: Cuenta económica } }
    post:
      tags: [Adjustments]
      security: [{ sessionCookie: [] }]
      summary: Solicita descuento, exoneración, recargo o corrección sin alterar el original
      responses: { '201': { description: Ajuste pendiente de aprobación }, '409': { $ref: '#/components/responses/Error' } }
  /infractions/{id}/adjustments/{adjustmentId}/approve:
    post:
      tags: [Adjustments]
      security: [{ sessionCookie: [] }]
      summary: Aprueba un ajuste con segregación entre solicitante y decisor
      responses: { '200': { description: Ajuste aprobado y saldo recalculado }, '409': { $ref: '#/components/responses/Error' } }
  /infractions/{id}/adjustments/{adjustmentId}/reject:
    post:
      tags: [Adjustments]
      security: [{ sessionCookie: [] }]
      summary: Rechaza un ajuste conservando historial
      responses: { '200': { description: Ajuste rechazado }, '409': { $ref: '#/components/responses/Error' } }
  /infractions/{id}/adjustments/{adjustmentId}/reverse:
    post:
      tags: [Adjustments]
      security: [{ sessionCookie: [] }]
      summary: Revierte un ajuste aprobado mediante una contrapartida append-only
      responses: { '200': { description: Ajuste reversado y saldo recalculado }, '409': { $ref: '#/components/responses/Error' } }
  /institutional-rules:
    get:
      tags: [Institutional rules]
      security: [{ sessionCookie: [] }]
      summary: Lista versiones de reglas legales y económicas
      responses: { '200': { description: Reglas versionadas } }
    post:
      tags: [Institutional rules]
      security: [{ sessionCookie: [] }]
      summary: Crea una nueva vigencia y cierra la anterior sin sobrescribirla
      responses: { '201': { description: Versión creada }, '409': { $ref: '#/components/responses/Error' } }
  /public/infractions/search:
    post:
      tags: [Public portal]
      summary: Consulta por número completo de boleta y placa; nunca solo por placa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketNumber, plate]
              additionalProperties: false
