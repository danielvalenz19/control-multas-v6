      summary: Revierte solo filas del lote sin referencias posteriores
      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MigrationConfirmation' } } }
      responses: { '200': { description: REVERTED o replay idempotente }, '409': { $ref: '#/components/responses/Error' } }
  /admin/historical-migrations/batches/{id}/report:
    get:
      tags: [Historical migrations]
      security: [{ sessionCookie: [] }]
      summary: Descarga conciliación CSV del lote
      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      responses: { '200': { description: Reporte CSV, content: { text/csv: { schema: { type: string } } } } }
  /admin/historical-migrations/templates/{entity}:
    get:
      tags: [Historical migrations]
      security: [{ sessionCookie: [] }]
      summary: Descarga una plantilla CSV con ejemplo sintético
      parameters:
        - { in: path, name: entity, required: true, schema: { $ref: '#/components/schemas/HistoricalEntity' } }
      responses: { '200': { description: Plantilla CSV, content: { text/csv: { schema: { type: string } } } } }
components:
  parameters:
    MigrationBatchId:
      in: path
      name: id
      required: true
      schema: { oneOf: [{ type: integer, minimum: 1 }, { type: string, format: uuid }] }
  schemas:
    HistoricalEntity:
      type: string
      enum: [citizens, vehicles, agents, infractions, infraction_items, payments, payment_allocations, receipts, adjustments, solvencies]
    MigrationConfirmation:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, description: 'IMPORTAR <uuid> o REVERTIR <uuid>' }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pmt_session
  responses:
    Error:
      description: Error estable con requestId
      content:
        application/json:
          schema:
            type: object
            required: [error, meta]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
              meta:
                type: object
                required: [requestId]
                properties:
                  requestId: { type: string, format: uuid }
