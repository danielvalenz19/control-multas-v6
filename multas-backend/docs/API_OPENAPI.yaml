      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      responses: { '200': { description: Resultado VALIDATED o REQUIRES_REVIEW }, '409': { $ref: '#/components/responses/Error' } }
  /admin/historical-migrations/batches/{id}/preview:
    get:
      tags: [Historical migrations]
      security: [{ sessionCookie: [] }]
      summary: Vista previa paginada de datos normalizados
      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      responses: { '200': { description: Filas staged } }
  /admin/historical-migrations/batches/{id}/errors:
    get:
      tags: [Historical migrations]
      security: [{ sessionCookie: [] }]
      summary: Lista errores con valores sensibles enmascarados
      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      responses: { '200': { description: Errores paginados } }
  /admin/historical-migrations/batches/{id}/conflicts:
    get:
      tags: [Historical migrations]
      security: [{ sessionCookie: [] }]
      summary: Lista duplicados, referencias y mapeos pendientes
      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      responses: { '200': { description: Conflictos paginados } }
  /admin/historical-migrations/batches/{id}/mappings:
    patch:
      tags: [Historical migrations]
      security: [{ sessionCookie: [] }]
      summary: Registra una decisión de mapeo versionada y explícita
      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappingType, sourceValue]
              properties:
                mappingType: { type: string, enum: [TABLE, COLUMN, STATUS, ARTICLE, AGENT, PAYMENT_METHOD] }
                entityType: { $ref: '#/components/schemas/HistoricalEntity' }
                sourceValue: { type: string }
                targetEntityType: { type: string }
                targetEntityId: { type: integer, minimum: 1 }
                targetValue: { type: string }
                conflictId: { type: integer, minimum: 1 }
      responses: { '200': { description: Mapeo aprobado y versionado }, '422': { $ref: '#/components/responses/Error' } }
  /admin/historical-migrations/batches/{id}/approve:
    post:
      tags: [Historical migrations]
      security: [{ sessionCookie: [] }]
      summary: Lleva un lote VALIDATED sin hallazgos a READY
      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      responses: { '200': { description: Lote READY }, '409': { $ref: '#/components/responses/Error' } }
  /admin/historical-migrations/batches/{id}/import:
    post:
      tags: [Historical migrations]
      security: [{ sessionCookie: [] }]
      summary: Importa append-only dentro de una transacción y genera conciliación
      parameters: [{ $ref: '#/components/parameters/MigrationBatchId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MigrationConfirmation' } } }
      responses: { '200': { description: COMPLETED o replay idempotente }, '409': { $ref: '#/components/responses/Error' } }
